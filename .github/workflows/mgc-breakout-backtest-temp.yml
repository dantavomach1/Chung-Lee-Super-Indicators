name: Temporary MGC Exit Sauce
on:
  push:
    branches:
      - research/mgc-hourly-breakout-backtest-20260827
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
      - name: Clone public MGC historical data
        run: git clone --depth 1 https://github.com/domzack/mgc-ohlcv-data.git /tmp/mgc-ohlcv-data
      - name: Run delayed-trail and asymmetric exit diagnostics
        run: python3 research/mgc_exit_sauce.py /tmp/mgc-ohlcv-data
      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mgc-exit-sauce
          path: backtest_output/
          if-no-files-found: warn
